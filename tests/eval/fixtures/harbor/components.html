<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Components · Harbor</title><link rel="stylesheet" href="components.css"></head>
<!-- The component catalog: every component in components.css, in every variant. The app's
     screens are built from these. -->
<body style="padding: 32px; display: flex; flex-direction: column; gap: 32px;">
  <section>
    <h2>Icon</h2>
    <svg class="icon icon--bell"><use href="icons.svg#bell"/></svg>
    <svg class="icon icon--plus"><use href="icons.svg#plus"/></svg>
    <svg class="icon icon--search"><use href="icons.svg#search"/></svg>
  </section>
  <section>
    <h2>Avatar</h2>
    <span class="avatar">AB</span>
    <span class="avatar avatar--lg">AB</span>
  </section>
  <section>
    <h2>Badge</h2>
    <span class="badge">Neutral</span>
    <span class="badge badge--success">Success</span>
    <span class="badge badge--warning">Warning</span>
    <span class="badge badge--danger">Danger</span>
  </section>
  <section>
    <h2>Button</h2>
    <button class="button button--primary">Primary</button>
    <button class="button button--secondary">Secondary</button>
    <button class="button button--primary"><svg class="icon icon--plus"><use href="icons.svg#plus"/></svg><span>With icon</span></button>
  </section>
  <section>
    <h2>Input</h2>
    <label class="input"><span class="input__label">Label</span><span class="input__field"><input placeholder="Placeholder"></span><span class="input__message">Helper text</span></label>
    <label class="input input--focus"><span class="input__label">Label</span><span class="input__field"><input value="Focused"></span></label>
    <label class="input input--error"><span class="input__label">Label</span><span class="input__field"><input value="Invalid"></span><span class="input__message">Error message</span></label>
    <label class="input input--disabled"><span class="input__label">Label</span><span class="input__field"><input value="Disabled" disabled></span></label>
  </section>
  <section>
    <h2>Tabs</h2>
    <nav class="tabs"><a class="tab tab--selected">Selected</a><a class="tab">Tab</a><a class="tab">Tab</a></nav>
  </section>
  <section>
    <h2>List item</h2>
    <div class="list-item"><span class="avatar">AB</span><div class="list-item__text"><span class="list-item__title">Title</span><span class="list-item__subtitle">Subtitle</span></div><span class="badge">Badge</span></div>
    <div class="list-item list-item--selected"><span class="avatar">AB</span><div class="list-item__text"><span class="list-item__title">Selected</span><span class="list-item__subtitle">Subtitle</span></div><span class="badge">Badge</span></div>
  </section>
  <section>
    <h2>Card and stat card</h2>
    <div class="card"><div class="card__header"><h2 class="card__title">Card title</h2></div><p>Any content</p></div>
    <div class="stat-card"><span class="stat-card__label">Label</span><span class="stat-card__value">$0</span><span class="badge">Trend</span></div>
  </section>
  <section>
    <h2>App header</h2>
    <header class="app-header"><span class="app-header__brand">Harbor</span><div class="app-header__actions"><svg class="icon icon--bell"><use href="icons.svg#bell"/></svg><span class="avatar">AK</span></div></header>
  </section>
</body>
</html>
