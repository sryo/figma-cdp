<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Store · Lumen</title><link rel="stylesheet" href="components.css"></head>
<body style="width: 1200px;">
  <header class="header">
    <span class="header__brand">Lumen</span>
    <nav class="header__nav">
      <a class="header__link" href="#discover">Discover</a>
      <a class="header__link" href="#library">Library</a>
      <a class="header__link header__link--active" href="#store" aria-current="page">Store</a>
    </nav>
    <span class="header__cart" aria-label="Cart">🛒<span class="header__badge">3</span></span>
  </header>
  <main class="grid">
    <article class="card"><div class="card__image"></div><span class="card__title">Orbit Headphones</span><span class="card__price">$129</span><button class="button button--primary">Add to cart</button></article>
    <article class="card"><div class="card__image"></div><span class="card__title">Tidal Turntable</span><span class="card__price">$349</span><button class="button button--primary">Add to cart</button></article>
    <article class="card"><div class="card__image"></div><span class="card__title">Pulse Earbuds</span><span class="card__price">$89</span><button class="button button--primary">Add to cart</button></article>
    <article class="card"><div class="card__image"></div><span class="card__title">Drift Speaker</span><span class="card__price">$199</span><button class="button button--primary" disabled>Sold out</button></article>
  </main>
</body>
</html>
